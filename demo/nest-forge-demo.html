`,X0=`:root {
  --bg: #101114;
  --surface: #17181d;
  --surface-2: #1d1f26;
  --text: #f5f6f8;
  --muted: #a7abb6;
  --line: #2a2d36;
  --accent: #7c5cff;
  --accent-soft: #9a82ff;
  --radius: 14px;
}
[data-theme="light"] {
  --bg: #f7f7f9;
  --surface: #ffffff;
  --surface-2: #f0f1f5;
  --text: #141519;
  --muted: #5b606c;
  --line: #e2e4ea;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  line-height: 1.6;
  transition: background 0.25s, color 0.25s;
}
.container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
h1, h2, h3 { line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); }
h2 { font-size: clamp(1.5rem, 3vw, 2.1rem); }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.eyebrow {
  text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.75rem;
  color: var(--accent-soft); font-weight: 700; margin-bottom: 8px;
}
.accent-text { color: var(--accent-soft); }
.lede { font-size: 1.1rem; color: var(--muted); max-width: 34rem; }

/* Nav */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.nav-inner { display: flex; align-items: center; gap: 24px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--text); text-decoration: none; }
.logo-mark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent-soft)); display: inline-block; }
.nav-links { display: flex; gap: 20px; margin-left: auto; }
.nav-links a { color: var(--muted); text-decoration: none; font-weight: 500; }
.nav-links a:hover { color: var(--text); }
.nav-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.nav-links + .nav-actions { margin-left: 0; }
.theme-btn {
  background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 1rem;

  "use strict";

  // Safe storage: sandboxed iframes may block localStorage — never crash.
  var store = {
    get: function (k) {
      try { return window.localStorage.getItem(k); } catch (e) { return null; }
    },
    set: function (k, v) {
      try { window.localStorage.setItem(k, v); } catch (e) { /* ignore */ }
    }
  };

  // Footer year
  var yearEl = document.getElementById("year");
  if (yearEl) yearEl.textContent = String(new Date().getFullYear());

  // Mobile nav
  var burger = document.getElementById("hamburger");
  var links = document.getElementById("navLinks");
  if (burger && links) {
    burger.addEventListener("click", function () {
      links.classList.toggle("open");
    });
    links.addEventListener("click", function (e) {
      if (e.target.tagName === "A") links.classList.remove("open");
    });
  }

  // Theme toggle (dark-first; light is the alternative)
  var themeBtn = document.getElementById("themeBtn");
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    store.set("agency-theme", t);
  }
  var saved = store.get("agency-theme");
  if (saved === "light" || saved === "dark") applyTheme(saved);
  if (themeBtn) {
    themeBtn.addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      applyTheme(cur === "light" ? "dark" : "light");
    });
  }

  // Contact form: validate + honest local confirmation (no backend in demo)
  var form = document.getElementById("contactForm");
  var note = document.getElementById("formNote");
  if (form && note) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var name = form.name.value.trim();
      var email = form.email.value.trim();
      var msg = form.message.value.trim();
      var emailOk = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email);
      if (!name || !emailOk || !msg) {
        note.textContent = "Please complete your name, a valid email and a message.";
        note.className = "form-note err";
        return;
      }
      note.textContent = "Thanks, " + name + "! Your message was recorded locally (demo) — we reply within one business day.";
      note.className = "form-note ok";
      form.reset();
    });
  }
})();

      if (!btn) return;

      var name = btn.getAttribute("data-tab");

        p.classList.toggle("active", p.getAttribute("data-panel") === name);

  "use strict";

  var yearEl = document.getElementById("year");
  if (yearEl) yearEl.textContent = String(new Date().getFullYear());

  // Mobile nav
  var burger = document.getElementById("hamburger");
  var links = document.getElementById("navLinks");

    links.addEventListener("click", function (e) {
      if (e.target.tagName === "A") links.classList.remove("open");
    });
  }

  // Pricing billing toggle: swap monthly/yearly numbers from data attributes
  var billingBtns = Array.prototype.slice.call(document.querySelectorAll(".billing-btn"));
  var priceNums = Array.prototype.slice.call(document.querySelectorAll("[data-monthly]"));
  billingBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      billingBtns.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      var cycle = btn.getAttribute("data-cycle");
      priceNums.forEach(function (el) {
        el.textContent = cycle === "yearly" ? el.getAttribute("data-yearly") : el.getAttribute("data-monthly");
      });
    });
  });

  // FAQ accordion (single open)
  var faq = document.getElementById("faq");
  if (faq) {
    faq.addEventListener("click", function (e) {
      var q = e.target.closest(".faq-q");
      if (!q) return;
      var item = q.parentElement;
      var wasOpen = item.classList.contains("open");
      Array.prototype.forEach.call(faq.querySelectorAll(".faq-item"), function (i) {
        i.classList.remove("open");
      });
      if (!wasOpen) item.classList.add("open");
    });
  }

  // CTA email capture (local demo confirmation)
  var form = document.getElementById("ctaForm");
  var note = document.getElementById("formNote");
  if (form && note) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = form.email.value.trim();
      var ok = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email);
      if (!ok) {
        note.textContent = "Please enter a valid work email to start your trial.";
        note.className = "form-note err";
        return;
      }
      note.textContent = "You're on the list (demo) — check " + email + " for your trial link.";
      note.className = "form-note ok";
      form.reset();
    });
  }
})();
